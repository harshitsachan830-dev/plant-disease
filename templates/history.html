<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#2e7d32;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            padding:12px;
            border:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#2e7d32;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        #searchInput{
            width:100%;
            padding:12px;
            margin:20px 0;
            border:1px solid #ccc;
            border-radius:8px;
        }

        .dark{
            background:#121212;
            color:white;
        }

        .dark table{
            background:#1e1e1e;
        }

        .dark td{
            color:white;
        }
    </style>
</head>

<body>

<h1>Prediction History</h1>

<div style="text-align:center; margin-bottom:20px;">
    <button onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>
</div>

<input
    type="text"
    id="searchInput"
    placeholder="🔍 Search plant or disease..."
>

<table>
<tr>
    <th>Plant</th>
    <th>Disease</th>
    <th>Confidence</th>
    <th>Status</th>
    <th>Severity</th>
</tr>

{% for row in predictions %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}%</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
</tr>
{% endfor %}

</table>
</body>
<script>
function toggleDarkMode(){
    document.body.classList.toggle('dark');
}

document.getElementById('searchInput')
.addEventListener('keyup', function(){

    let filter = this.value.toLowerCase();

    let rows = document.querySelectorAll('table tr');

    rows.forEach((row,index)=>{

        if(index===0) return;

        row.style.display =
            row.innerText.toLowerCase().includes(filter)
            ? ''
            : 'none';
    });
});
</script>
</html>
